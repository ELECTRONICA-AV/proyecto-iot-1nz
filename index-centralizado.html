
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#061426"
  >

  <title>CETA | Cierre Centralizado</title>

  <link
    rel="stylesheet"
    href="centralizado-login.css"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

  <!-- =====================================================
       DECORACIÓN DEL FONDO
  ====================================================== -->

  <div class="background-decoration"></div>


  <!-- =====================================================
       CONTENEDOR PRINCIPAL
  ====================================================== -->

  <main class="login-container">


    <section class="login-card">


      <!-- =================================================
           IDENTIDAD INSTITUCIONAL CETA
      ================================================== -->

      <header class="brand-section">


        <!-- LOGO -->

        <div class="ceta-logo-wrapper">

          <img
            src="img/LogoIns.jpeg"
            alt="CETA - Instituto Tecnológico de Enseñanza Automotriz"
            class="ceta-logo"
          >

        </div>


        <!-- NOMBRE -->

        <div class="brand-text">

          <h1>
            CETA
          </h1>

          <p>
            ELECTRICIDAD Y ELECTRÓNICA AUTOMOTRIZ
          </p>

        </div>


      </header>


      <!-- =================================================
           SEPARADOR
      ================================================== -->

      <div class="separator"></div>


      <!-- =================================================
           INFORMACIÓN DEL SISTEMA
      ================================================== -->

      <section class="project-info">

        <span class="project-label">
          CONTROL VEHICULAR
        </span>

        <h2>
          Cierre Centralizado
        </h2>

        <p>
          Sistema de acceso y control remoto
          del vehículo.
        </p>

      </section>


      <!-- =================================================
           LOGIN
      ================================================== -->

      <form id="loginForm">


        <label for="password">
          CONTRASEÑA DE ACCESO
        </label>


        <div class="password-container">


          <span class="password-icon">
            🔒
          </span>


          <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          >


        </div>


        <!-- BOTÓN INGRESAR -->

        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          INGRESAR AL SISTEMA
        </button>


        <!-- MENSAJE LOGIN -->

        <p
          id="message"
          role="status"
          aria-live="polite"
        ></p>


      </form>


      <!-- =================================================
           VOLVER AL SELECTOR DE MAQUETAS
      ================================================== -->

      <button
        type="button"
        class="back-button"
        onclick="window.location.href='index.html'"
      >
        ← VOLVER A MAQUETAS
      </button>


      <!-- =================================================
           ESTADO DEL SISTEMA
      ================================================== -->

      <footer class="login-footer">

        <span class="status-dot"></span>

        <span>
          SISTEMA DE ACCESO SEGURO
        </span>

      </footer>


    </section>


  </main>


  <!-- =====================================================
       LÓGICA DEL LOGIN
  ====================================================== -->

  <script src="app-centralizado.js"></script>


</body>

</html>
