
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#061426"
  >

  <title>CETA | Cierre Centralizado</title>

  <link
    rel="stylesheet"
    href="centralizado-login.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Decoración de fondo -->
  <div class="background-decoration"></div>


  <main class="login-container">

    <section class="login-card">

      <!-- ==================================================
           MARCA
      =================================================== -->

      <header class="brand-section">

        <!--
          Cuando tengamos el logo real, reemplazaremos
          este bloque por una imagen.
        -->
        <div class="logo">
          CETA
        </div>

        <div class="brand-text">

          <h1>CETA</h1>

          <p class="brand-name">
            ELECTRICIDAD Y ELECTRÓNICA AUTOMOTRIZ
          </p>

        </div>

      </header>


      <div class="separator"></div>


      <!-- ==================================================
           PROYECTO
      =================================================== -->

      <section class="project-info">

        <span class="project-label">
          CONTROL VEHICULAR
        </span>

        <h2>
          Cierre Centralizado
        </h2>

        <p>
          Acceso al sistema de control remoto
          del vehículo.
        </p>

      </section>


      <!-- ==================================================
           LOGIN
      =================================================== -->

      <form id="loginForm">

        <label for="password">
          CONTRASEÑA DE ACCESO
        </label>


        <div class="password-container">

          <span class="password-icon">
            🔒
          </span>

          <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          INGRESAR AL SISTEMA
        </button>


        <p id="message"></p>

      </form>


      <!-- ==================================================
           VOLVER
      =================================================== -->

      <button
        type="button"
        class="back-button"
        onclick="window.location.href='index.html'"
      >
        ← VOLVER A MAQUETAS
      </button>


      <!-- ==================================================
           PIE
      =================================================== -->

      <footer class="login-footer">

        <span class="status-dot"></span>

        <span>
          SISTEMA DE ACCESO SEGURO
        </span>

      </footer>

    </section>

  </main>


  <script src="app-centralizado.js"></script>

</body>
</html>
